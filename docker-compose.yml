services:
  mongo:
    image: mongo:7
    container_name: flashdelivery-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  app:
    build: .
    container_name: flashdelivery-app
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/bd-flashdelivery
      - PORT=3000
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
